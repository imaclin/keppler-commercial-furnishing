# Builds the site for Cloudflare Workers and deploys it.
#
#   push to main        -> production (kepplercf)
#   pull request        -> a preview version of the Worker; its URL is posted
#                          as a comment on the PR, so a branch can be checked
#                          before it is merged (nothing live changes)
#
# DATABASE_URL is needed at build time too: a few static pages read the site
# settings (title, contact details) from the database while prerendering.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Allow build-tool install scripts
        run: npm install-scripts approve esbuild workerd fsevents && npm rebuild esbuild workerd

      - name: Test
        run: npm run test -- --exclude test/catalog.integration.test.ts

      - name: Build for Workers
        run: npm run build:cf
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to production
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload preview version
        if: github.event_name == 'pull_request'
        id: preview
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}" | tee out.txt
          url=$(grep -oE 'https://pr-[0-9]+-kepplercf[^ ]*workers\.dev' out.txt | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post the preview link
        if: github.event_name == 'pull_request' && steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const marker = '<!-- keppler-preview -->';
            const body = `${marker}\nPreview of this branch: ${url}\n\nIt uses the live database, so what you see is real data. Nothing on the live site changes until this is merged.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find((c) => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
